<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="{{BASE}}"><title>Event icon review</title>
<link rel="stylesheet" href="css/index.css">
<style>
html,body{position:static!important;height:auto!important;overflow:auto!important}body{display:block!important;padding:28px;max-width:1200px;margin:auto;background:#f4f3ef;color:#252936;font:15px/1.45 system-ui}body[data-dark]{background:#171c25;color:#f2f3f6}h1{font-size:30px;margin:0}p{margin:8px 0 20px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}select,input,button{font:inherit;padding:9px;border:1px solid #8993a3;border-radius:6px;background:inherit;color:inherit}input{min-width:200px;flex:1}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.review{border-top:1px solid #8893a355;padding:18px 0}.meta{font-size:12px;opacity:.8;margin-bottom:8px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.popup-event-card{background:#ffffff70;border-radius:9px;padding:14px}.popup-event-card-name{color:var(--popup-accent-vivid,#334)}body[data-dark] .popup-event-card{background:#ffffff08}body[data-dark] .popup-event-card-name{color:var(--popup-accent-vivid,#cde)}.popup-event-card-preview{max-height:4.5em;overflow:hidden}#paging{display:flex;gap:10px;align-items:center;margin:20px 0}@media(max-width:620px){body{padding:16px}.pair{grid-template-columns:1fr}.controls>*{max-width:100%}}
</style>
<h1>Event icon review</h1><p>Rule proposals beside the existing Noto artwork. This read-only report does not modify saved assignments or apply manual overrides.</p>
<div id="summary"></div><div class="controls"><select id="decision" aria-label="Decision"><option value="proposed">Proposed</option><option value="review">Needs review</option><option value="fallback">Fallback</option><option value="all">All decisions</option></select><select id="icon" aria-label="Icon"><option value="">All icons</option></select><input id="search" placeholder="Search event or venue" aria-label="Search event or venue"><select id="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div id="paging"><button id="previous">Previous</button><span id="count"></span><button id="next">Next</button></div><main id="rows"></main>
<script id="review-data" type="application/json">{{DATA}}</script>
<script src="js/core/constants.js"></script><script src="js/core/utils.js"></script><script src="js/core/colorUtils.js"></script><script src="js/tags/tagColorManager.js"></script><script src="js/map/mapManager.js"></script><script src="js/core/eventIconCatalog.js"></script><script src="js/ui/iconManager.js"></script><script src="js/ui/popupContentBuilder.js"></script>
<script>
const report=JSON.parse(document.getElementById('review-data').textContent);
IconManager.init();const $=id=>document.getElementById(id);let offset=0;const pageSize=30;
$('summary').textContent=`${report.summary.total.toLocaleString()} events · ${report.summary.decisions.proposed||0} proposed · ${report.summary.decisions.review||0} need review · ${report.summary.decisions.fallback||0} keep fallback`;
Object.values(IconCatalog.icons).filter(icon=>!icon.id.startsWith('noto-')).forEach(icon=>{const option=document.createElement('option');option.value=icon.id;option.textContent=icon.id;$('icon').append(option)});
function render(){
 const theme=$('theme').value;document.documentElement.dataset.theme=theme;document.body.toggleAttribute('data-dark',theme==='dark');
 const query=$('search').value.toLowerCase();const rows=report.rows.filter(r=>($('decision').value==='all'||r.decision===$('decision').value)&&(!$('icon').value||r.icon_id===$('icon').value||r.evidence.some(e=>e.icon_id===$('icon').value))&&((r.event.name||'')+' '+(r.event.venue||'')).toLowerCase().includes(query));
 $('rows').replaceChildren();$('count').textContent=rows.length?`${offset+1}–${Math.min(offset+pageSize,rows.length)} of ${rows.length}`:'No matches';$('previous').disabled=offset===0;$('next').disabled=offset+pageSize>=rows.length;
 rows.slice(offset,offset+pageSize).forEach(row=>{
  const section=document.createElement('section');section.className='review';const meta=document.createElement('div');meta.className='meta';meta.textContent=`#${row.event.id} · ${row.event.venue||''} · ${row.reason}`;section.append(meta);
  const pair=document.createElement('div');pair.className='pair';
  [false,true].forEach(useIcon=>{const col=document.createElement('div');const label=document.createElement('div');label.className='label';label.textContent=useIcon?(row.icon_id?row.icon_id:'Keep fallback — '+row.decision):'Existing';col.append(label);col.append(PopupContentBuilder.createEventCard({...row.event,icon_id:useIcon?row.icon_id:null},{interactive:false}));pair.append(col)});
  section.append(pair);$('rows').append(section);
 });
}
['decision','icon','theme'].forEach(id=>$(id).onchange=()=>{offset=0;render()});$('search').oninput=()=>{offset=0;render()};$('previous').onclick=()=>{offset=Math.max(0,offset-pageSize);render()};$('next').onclick=()=>{offset+=pageSize;render()};render();
</script>
</html>

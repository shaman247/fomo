<!doctype html><meta charset="utf-8"><title>Equipment geometry studies</title><style>body{margin:0;background:#eee;font:14px system-ui}header{padding:12px}button,select{margin-right:8px}main{display:grid;grid-template-columns:repeat(6,240px)}figure{margin:0;background:#f4f3ef}canvas{display:block}figcaption{text-align:center;padding:6px}</style><header><select id="subject"></select><span>Original geometry · front / rear / left / right / top / icon</span></header><main></main>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const data=window.SCENES||await(await fetch('./scenes.json')).json();const select=document.querySelector('select');for(const name of Object.keys(data))select.add(new Option(name,name));
window.renderScene=async(name)=>{document.querySelector('main').replaceChildren();const s=data[name];for(const [label,position] of [['front',[0,0,10]],['rear',[0,0,-10]],['left',[-10,0,0]],['right',[10,0,0]],['top',[0,10,.0001]],['icon',s.camera]]){const scene=new T.Scene();for(const p of s.parts){const points=[];for(const f of p.faces)for(let i=1;i<f.length-1;i++)for(const ix of [f[0],f[i],f[i+1]])points.push(...p.vertices[ix]);const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(points,3));geo.computeVertexNormals();scene.add(new T.Mesh(geo,new T.MeshLambertMaterial({color:p.color,side:T.DoubleSide})));}const bounds=new T.Box3().setFromObject(scene),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3());const extent=Math.max(size.x,size.y,size.z)*.85;const camera=new T.OrthographicCamera(-extent,extent,extent,-extent,.01,100);camera.position.copy(center).add(new T.Vector3(...position).normalize().multiplyScalar(10));camera.lookAt(center);scene.add(new T.AmbientLight(0xffffff,1.2));const key=new T.DirectionalLight(0xffffff,2);key.position.set(-4,8,5);scene.add(key);const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(240,260);renderer.setPixelRatio(1);renderer.render(scene,camera);const figure=document.createElement('figure');figure.append(renderer.domElement);const cap=document.createElement('figcaption');cap.textContent=name+' · '+label;figure.append(cap);document.querySelector('main').append(figure);}await new Promise(requestAnimationFrame);return true};select.onchange=()=>window.renderScene(select.value);await window.renderScene(select.value);window.ready=true;
</script>

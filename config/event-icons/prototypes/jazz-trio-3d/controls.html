<div id="jazz-trio-geometry">
  <style>
    #jazz-trio-geometry [data-stage]{width:100%;height:clamp(350px,62vw,530px);position:relative;overflow:hidden}
    #jazz-trio-geometry canvas{display:block;width:100%;height:100%;cursor:grab}
    #jazz-trio-geometry canvas:active{cursor:grabbing}
    #jazz-trio-geometry .scene-caption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  </style>
  <h3>Jazz trio · 3D geometry study</h3>
  <div class="viz-controls">
    <label class="form-label">View
      <select class="form-select" data-view>
        <option value="icon">Drummer centered</option>
        <option value="quarter">Three-quarter</option>
        <option value="top">Overhead</option>
        <option value="keyboard">Keyboard side</option>
        <option value="left">Left</option>
        <option value="bass">Right</option>
        <option value="rear">Rear</option>
      </select>
    </label>
    <label class="form-label">Show
      <select class="form-select" data-entity>
        <option value="all">Full trio</option>
        <option value="Keyboard">Keyboardist</option>
        <option value="Drums">Drummer</option>
        <option value="Bass">Bassist</option>
      </select>
    </label>
    <label class="form-label">Head scale <span data-head-value>1.35×</span><input class="form-range" type="range" min="1" max="1.6" step=".05" value="1.35" data-head></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" checked data-guide><span class="form-check-label">Layout guide</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-joints><span class="form-check-label">Joint overlay</span></label>
  </div>
  <div data-stage></div>
  <div class="scene-caption text-small"><span>Drag to orbit · scroll to zoom</span><span>0.5 m grid</span></div>
</div>

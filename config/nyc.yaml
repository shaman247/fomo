    venue: [Beverage Venue, Community Center, Cultural Venue, Event Hall, Government, Hospital, Hotel, House of Worship, Meetup Point, Office, Outdoor Venue, School, Shop, Studio, Nightclub, attraction, Fitness & Recreation]

# fomo.nyc — city/region configuration
#
# This is the single file holding every NYC-specific string the backend engine
# needs. The engine reads it via pipeline/city_config.py (config/<FOMO_CITY>.yaml,
# default "nyc"). To adapt the project to another city, copy this file to
# config/<city>.yaml, replace the values, and set FOMO_CITY=<city> — or just edit
# the values here. Each field notes the engine code that consumes it.

city_name: "New York City"
city_short: "NYC"
metro_name: "New York City"

extraction:
  # extractor.py get_chunk_prompt: "...Extract ALL events from this <page_descriptor> events page content."
  page_descriptor: "NYC"
  # extractor.py get_prompt: the sentence after "Today's date is ...".
  intro: "We are assembling a database of upcoming events in New York City."
  # extractor.py get_prompt hashtag-guidance tail.
  tag_avoidance: "Avoid location-specific or NYC-redundant tags."
  # extractor.py get_prompt: the full metro-geography rule bullet (verbatim).
  region_rule: "Only include events in the NYC metro area within the next 3 months. The NYC metro area includes: all five NYC boroughs; Long Island (Nassau, Suffolk, the Hamptons); Westchester and Rockland counties; the Hudson Valley (Dutchess, Orange, Ulster, Putnam); Northern New Jersey (Bergen, Hudson, Essex, Passaic, Union, Middlesex, Monmouth, Ocean); and Southern Connecticut (Fairfield County). Skip events at venues outside this metro region (e.g. Philadelphia, Boston, Chicago, LA, Europe, etc.)."

# db.py _load_generic_location_names() — city-level names added on top of tags.json geotags.
generic_location_names:
  - "new york"
  - "nyc"
  - "new york city"
  - "ny"

processor:
  # processor.py normalize_location_name — trailing state abbreviations/names stripped.
  state_suffixes: [" ny", " nj", " ct", " new york", " new jersey", " connecticut"]
  # processor.py normalize_location_name — bare area names that collapse to "" (too generic).
  city_area_tokens:
    - "nyc"
    - "new york"
    - "brooklyn"
    - "manhattan"
    - "queens"
    - "bronx"
    - "staten island"
    - "the bronx"
    - "long island"
  # processor.py has_dash_before_borough — borough subset used to detect "<thing> - <borough>".
  borough_tokens: ["queens", "bronx", "brooklyn", "manhattan", "staten island"]
  # processor.py — standalone region token stripped from tag / short_name (e.g. "NYC Comedy" -> "Comedy").
  region_tag_token: "NYC"

review:
  # scripts/find_review_candidates.py NON_NYC_PLACES — names that, in an event's
  # location_name, suggest it is outside the metro region. Word-boundary matched.
  # Omits names that overlap NYC venues/streets (Washington, Phoenix, Boston, Vermont, Georgia, Rhode Island).

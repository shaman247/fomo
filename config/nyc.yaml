# fomo.nyc — city/region configuration
#
# This is the single file holding every NYC-specific string the backend engine
# needs. The engine reads it via pipeline/city_config.py (config/<FOMO_CITY>.yaml,
# default "nyc"). To adapt the project to another city, copy this file to
# config/<city>.yaml, replace the values, and set FOMO_CITY=<city> — or just edit
# the values here. Each field notes the engine code that consumes it.

city_name: "New York City"
city_short: "NYC"
metro_name: "New York City"

# Frontend config — injected into the built site by build.js (window.__CITY__ for the
# JS bundle + {{TOKEN}} branding replacement in src/index.html). See build.js.
frontend:
  site_name: "Fomo NYC"          # <title>, logo alt, search placeholder, menu
  domain: "fomo.nyc"             # "Search fomo.nyc", "About fomo.nyc"
  emoji: "🗽"                     # menu / feedback decoration
  timezone: "America/New_York"   # utils.js: "today" + event-time parsing
  sw_enabled: true               # offline service worker (false emits a self-unregistering sw.js)
  # Selector-only grouping and ordering; the database supplies the neighborhoods.
  # Groups relocate members in this menu only. Directional borough sections are
  # browsing conventions, not official boundaries; unlisted children stay visible.
  # Stable identities for configured geographic groups; retain each ID when renaming a label.
  area_ids:
    NYC: "area:nyc"
    Brooklyn: "area:brooklyn"
    North Brooklyn: "area:north-brooklyn"
    Northwest Brooklyn: "area:northwest-brooklyn"
    Central Brooklyn: "area:central-brooklyn"
    East Brooklyn: "area:east-brooklyn"
    South Brooklyn: "area:south-brooklyn"
    Queens: "area:queens"
    Northwest Queens: "area:northwest-queens"
    Northeast Queens: "area:northeast-queens"
    Central Queens: "area:central-queens"
    Southeast Queens: "area:southeast-queens"
    Bronx: "area:bronx"
    Northwest Bronx: "area:northwest-bronx"
    South Bronx: "area:south-bronx"
    Central Bronx: "area:central-bronx"
    East Bronx: "area:east-bronx"
    Staten Island: "area:staten-island"
    North Shore (Staten Island): "area:north-shore-staten-island"
    Mid-Island (Staten Island): "area:mid-island-staten-island"
    South Shore (Staten Island): "area:south-shore-staten-island"
    Manhattan: "area:manhattan"
    Manhattan Parks & Islands: "area:manhattan-parks-islands"
  # Explicit venue identities: do not move activity descendants (e.g. Gardening,
  # Theater, or Book Club) just because they share a venue-related ancestor.
  # Only these reviewed identities may head the public topic/venue menus.
  # New curated tags need a parent; changing this list is an explicit root decision.

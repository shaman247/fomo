extraction:
  # extractor.py get_chunk_prompt — the full opening line. {date} is substituted.
  chunk_intro: "Today's date is {date}. Extract ALL events from this NYC events page content."
  # extractor.py get_prompt — the full opening line. {date}, {name}, {url} are substituted.
  intro: "Today's date is {date}. We are assembling a database of upcoming events in New York City. Currently, we are inspecting {name} ({url})."
  # extractor.py get_prompt hashtag-guidance tail.
  tag_avoidance: "Avoid location-specific or NYC-redundant tags."
  # extractor.py get_prompt: the full metro-geography rule bullet (verbatim).
  # KEEP THIS COUNTY LIST IN SYNC WITH THE `coverage:` BLOCK BELOW. This prose is
  # the extractor's FIRST filter — an event this rule tells Gemini to skip is
  # dropped before the ZIP-based `coverage:` test ever sees it, so a county that
  # is in `coverage:` but missing here is a SILENT coverage loss, not a
  # belt-and-braces double check. Fixed 2026-08-12: Morris, Somerset and
  # Hunterdon were deliberately IN under `coverage:` (see the ZIP3 078/079/088
  # notes) but omitted here, which contradicted w4725 Morris County Park
  # Commission being a legitimate source across its whole footprint.
  region_rule: "Only include events in the NYC metro area within the next 3 months. The NYC metro area includes: all five NYC boroughs; Long Island (Nassau, Suffolk, the Hamptons); Westchester and Rockland counties; the Hudson Valley (Dutchess, Orange, Ulster, Putnam); Northern and Central New Jersey (Bergen, Hudson, Essex, Passaic, Union, Morris, Middlesex, Somerset, Hunterdon, Monmouth, Ocean); and Southern Connecticut (Fairfield County). Skip events at venues outside this metro region (e.g. Philadelphia, Boston, Chicago, LA, Europe, etc.)."

# db.py _load_generic_location_names() — city-level names added on top of the geotags list below.
generic_location_names:
  - "new york"
  - "nyc"
  - "new york city"
  - "ny"


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{SITE_NAME}}</title>
    <link rel="icon" href="images/torch.svg" type="image/svg+xml">

    <!-- Android System WebView glyph fix. Our map styles ship no `glyphs` URL,
         so MapLibre renders every label locally via its TinySDF fallback, whose
         canvas is an OffscreenCanvas whenever one is defined. On Android WebView,
         main-thread OffscreenCanvas 2D text readback comes back blank, so every
         glyph rasterizes empty and the map shows no labels at all. Desktop works;
         iOS lacks main-thread OffscreenCanvas and already falls back to a DOM
         canvas. Probe the readback and, only when it's broken, drop the global so
         MapLibre uses the DOM-canvas path too. Runs before maplibre-gl.js loads. -->
    <script>
    (function () {
        if (typeof OffscreenCanvas === 'undefined') return;
        var broken = false;
        try {
            var oc = new OffscreenCanvas(24, 24);
            var ctx = oc.getContext('2d', { willReadFrequently: true });
            if (!ctx) {
                broken = true;
            } else {
                ctx.textBaseline = 'top';
                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#000';
                ctx.fillText('A', 2, 2);
                var px = ctx.getImageData(0, 0, 24, 24).data;
                broken = true;
                for (var i = 3; i < px.length; i += 4) {
                    if (px[i] !== 0) { broken = false; break; }
                }
            }
        } catch (e) {
            broken = true;
        }
        if (broken) {
            try { delete window.OffscreenCanvas; }
            catch (e) { try { window.OffscreenCanvas = undefined; } catch (e2) {} }
        }
    })();
    </script>

    <!-- Warm up the only remaining cross-origin: the map tile/glyph CDN. -->
    <link rel="preconnect" href="https://api.protomaps.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.protomaps.com">

    <!-- Start the render-critical fetches during HTML parse, before the
         bottom-of-body scripts download + execute and App.init() runs. -->
    <link rel="preload" as="script" href="vendor/maplibre-gl.js?v=5.24.0">
    <!-- crossorigin is required on as=fetch preloads so the request's CORS mode
         matches fetch()'s default — without it the file is downloaded twice. -->
    <link rel="preload" as="fetch" href="data/manifest.json" crossorigin>
    <link rel="preload" as="fetch" href="data/tags.json" crossorigin>
    <link rel="preload" as="fetch" href="data/tag_hierarchy.json" crossorigin>

    <!-- Self-hosted (see src/vendor and src/css/fonts.css). ?v= busts the
         1-year cache when the pinned version changes. -->
    <link rel="stylesheet" href="vendor/maplibre-gl.css?v=5.24.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" crossorigin="anonymous">
</head>
<body>
    <div id="app-container">
        <div id="filter-panel" class="tags-collapsed">
            <div id="loading-container">
                <p class="loading-message">Loading... please wait 🧘</p>
                <div class="loading-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="loading-progress-bar"></div>
                </div>
            </div>
            <div id="filter-container" class="initially-hidden">
                <div>
                    <div id="logo-menu-wrapper">
                        <button id="logo-container" class="initially-hidden" aria-label="Open menu" aria-haspopup="true" aria-expanded="false">
                            <img src="images/torch.svg" alt="{{SITE_NAME}} Logo" id="logo">
                        </button>
                        <div id="logo-menu" class="logo-menu-hidden" role="menu" aria-label="Logo menu">
                            <button type="button" id="settings-btn" role="menuitem">⚙️ Settings</button>
                            <button type="button" id="share-view-btn" role="menuitem">🔗 Share this view</button>
                            <button type="button" id="feedback-btn" role="menuitem">💬 Submit feedback</button>
                            <a href="about.html" target="_blank" role="menuitem">{{EMOJI}} About {{DOMAIN}}</a>
                        </div>
                    </div>
                    <div class="filter-group" id="omni-search-filter">
                        <div class="search-input-container">
                            <input type="text" id="omni-search-input" placeholder="Search {{DOMAIN}}" autocomplete="off" aria-label="Search places, events, organizers">
                            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 0 24 24" width="18px" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </div>
                    </div>
                    <div class="filter-group" id="date-filter-container">
                        <div class="date-picker-container">
                            <input type="text" id="date-picker" placeholder="Select date range..." aria-label="Select date range">
                            <span id="date-picker-sizer" aria-hidden="true"></span>
                            <svg class="calendar-icon" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 0 24 24" width="18px" fill="currentColor" aria-hidden="true"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7v-5z"/></svg>
                        </div>
                    </div>
                </div>
                <div id="chip-bar"></div>
            </div>
            <button id="expand-filter-panel-button" class="initially-hidden collapsed" aria-label="Expand Filter Panel" title="Expand Filter Panel">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
        </div>

        <!-- Event list / search results sheet, shared by desktop and mobile.
             Desktop: slides in from the left edge; the floating #sheet-handle
             "Show list" button appears at the screen's left edge only while
             collapsed (the open sheet is dismissed by clicking the map).
             Mobile: a bottom sheet with a drag grip; .sheet-detail hosts a
             tapped marker's popup content. When closed, the sheet's top edge
             (the grip strip) stays peeking at the bottom of the screen — tap
             or drag up to reopen. -->
        <div id="sheet" class="sheet-collapsed initially-hidden">
            <div class="sheet-drag-area" role="button" aria-label="Toggle event list"><div class="sheet-grip"></div></div>
            <div class="sheet-content">
                <div id="tags-wrapper">
                    <div id="results-container" role="list" aria-label="Search results"></div>
                </div>
                <div class="sheet-detail"></div>
            </div>
        </div>
        <button id="sheet-handle" class="sheet-collapsed initially-hidden" type="button" aria-label="Show list" aria-expanded="false">
            <svg class="sheet-handle-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5l8 7-8 7z" fill="currentColor"/></svg>
            <span class="sheet-handle-label" aria-hidden="true">Show list</span>
        </button>

        <div id="map-container">
            <div id="map-wrapper">
                <div id="map" role="application" aria-label="Interactive map of NYC events"></div>
            </div>
            <div id="phase2-loading-indicator" role="status" aria-live="polite">
                <span class="phase2-spinner" aria-hidden="true"></span>
                <span class="phase2-label">Loading events…</span>
                <span class="phase2-progress"></span>
            </div>
        </div>
    </div>

    <!-- Welcome Modal -->
    <div id="welcome-modal" class="modal" role="dialog" aria-labelledby="welcome-modal-title" aria-modal="true">
        <div class="modal-content">
            <div class="modal-body">
                {{WELCOME_MODAL}}
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification" role="status" aria-live="polite"></div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal" role="dialog" aria-labelledby="feedback-modal-title" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="feedback-modal-title">Submit Feedback</h2>
                <button id="feedback-close-btn" class="modal-close-btn" aria-label="Close feedback">&times;</button>
            </div>
            <div class="modal-body">
                <p class="feedback-description">Help improve <strong>{{DOMAIN}}</strong>! 💖 <br> Share your thoughts, report issues, or suggest new features {{EMOJI}}</p>
                <textarea id="feedback-message" placeholder="Enter your feedback here..." rows="6" maxlength="10000" aria-label="Feedback message"></textarea>
                <div class="feedback-footer">
                    <span id="feedback-char-count" class="feedback-char-count">0 / 10000</span>
                    <button id="feedback-submit-btn" class="feedback-submit-btn" disabled>Submit</button>
                </div>
                <div id="feedback-status" class="feedback-status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" role="dialog" aria-labelledby="settings-modal-title" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settings-modal-title">Settings</h2>
                <button id="settings-close-btn" class="modal-close-btn" aria-label="Close settings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label class="setting-group-label">Theme</label>
                    <div class="setting-options">
                        <label class="setting-option">
                            <input type="radio" name="theme" value="dark" checked>
                            <span>Dark</span>
                        </label>
                        <label class="setting-option">
                            <input type="radio" name="theme" value="light">
                            <span>Light</span>
                        </label>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-group-label">Icons</label>
                    <div class="setting-options">
                        <label class="setting-option">
                            <input type="radio" name="emoji-font" value="system" checked>
                            <span><span class="emoji-preview emoji-preview-system">🎺</span> Default</span>
                        </label>
                        <label class="setting-option">
                            <input type="radio" name="emoji-font" value="noto">
                            <span><img src="images/trumpet.svg" alt="🎺" class="emoji-preview-noto" width="20" height="20"> Noto</span>
                        </label>
                    </div>
                    <span id="emoji-font-status" class="setting-status"></span>
                </div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="css/index.css">

    <script src="vendor/maplibre-gl.js?v=5.24.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" crossorigin="anonymous"></script>

    <!-- Core -->
    <script src="js/core/constants.js"></script>
    <script src="js/core/themes.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/protoFlags.js"></script>
    <script src="js/core/colorUtils.js"></script>
    <script src="js/core/emojiTransforms.js"></script>
    <script src="js/core/historyManager.js"></script>
    <script src="js/core/urlParams.js"></script>

    <!-- Data -->
    <script src="js/data/filterManager.js"></script>
    <script src="js/data/dataCache.js"></script>
    <script src="js/data/dataManager.js"></script>
    <script src="js/data/searchManager.js"></script>

    <!-- Tags -->
    <script src="js/tags/tagColorManager.js"></script>
    <script src="js/tags/tagStateManager.js"></script>
    <script src="js/tags/sectionRenderer.js"></script>
    <script src="js/tags/searchController.js"></script>
    <script src="js/tags/filterPanelUI.js"></script>

    <!-- UI -->
    <script src="js/ui/modalManager.js"></script>
    <script src="js/ui/toastNotifier.js"></script>
    <script src="js/ui/gestureHandler.js"></script>
    <script src="js/ui/sheet.js"></script>
    <script src="js/ui/popupContentBuilder.js"></script>
    <script src="js/ui/listView.js"></script>
    <script src="js/ui/uiManager.js"></script>
    <script src="js/ui/emojiManager.js"></script>
    <script src="js/ui/themeManager.js"></script>
    <script src="js/ui/feedbackManager.js"></script>

    <!-- Map -->
    <script src="js/map/mapManager.js?v=4"></script>
    <script src="js/map/viewportManager.js"></script>
    <script src="js/map/markerController.js?v=4"></script>

    <!-- Main Application -->
    <script src="js/script.js?v=4"></script>
</body>
</html>
